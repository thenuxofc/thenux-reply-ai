<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#12121F"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="#0A0A12"/>

  <!-- Column labels -->
  <g font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#8B5CF6" opacity="0.85">
    <text x="140" y="34" text-anchor="middle">INPUT</text>
    <text x="500" y="34" text-anchor="middle">CAPTURE</text>
    <text x="860" y="34" text-anchor="middle">CORE ENGINE</text>
    <text x="1080" y="34" text-anchor="middle">OUTPUT</text>
  </g>

  <!-- INPUT nodes -->
  <g font-family="'Segoe UI', sans-serif" font-size="13" fill="#E0E0F0">
    <g transform="translate(30,70)">
      <rect width="220" height="56" rx="12" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="110" y="34" text-anchor="middle">💬 Messaging App</text>
    </g>
    <g transform="translate(30,180)">
      <rect width="220" height="56" rx="12" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="110" y="34" text-anchor="middle">🔔 System Notification</text>
    </g>
    <g transform="translate(30,290)">
      <rect width="220" height="56" rx="12" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="110" y="34" text-anchor="middle">📋 Highlighted Text</text>
    </g>
  </g>

  <!-- CAPTURE nodes -->
  <g font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#E0E0F0">
    <g transform="translate(390,70)">
      <rect width="230" height="56" rx="12" fill="url(#nodeGrad)" stroke="#00F0FF" stroke-opacity="0.5"/>
      <text x="115" y="27" text-anchor="middle">ChatAccessibility</text>
      <text x="115" y="43" text-anchor="middle" font-size="11" fill="#9CA3AF">Service</text>
    </g>
    <g transform="translate(390,180)">
      <rect width="230" height="56" rx="12" fill="url(#nodeGrad)" stroke="#00F0FF" stroke-opacity="0.5"/>
      <text x="115" y="27" text-anchor="middle">NotificationListener</text>
      <text x="115" y="43" text-anchor="middle" font-size="11" fill="#9CA3AF">Service</text>
    </g>
    <g transform="translate(390,290)">
      <rect width="230" height="56" rx="12" fill="url(#nodeGrad)" stroke="#00F0FF" stroke-opacity="0.5"/>
      <text x="115" y="27" text-anchor="middle">PROCESS_TEXT</text>
      <text x="115" y="43" text-anchor="middle" font-size="11" fill="#9CA3AF">Intent Handler</text>
    </g>
  </g>

  <!-- CORE nodes -->
  <g font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#E0E0F0">
    <g transform="translate(750,150)" filter="url(#nodeGlow)">
      <rect width="230" height="150" rx="16" fill="url(#nodeGrad)" stroke="url(#lineGrad)" stroke-width="1.6"/>
      <text x="115" y="34" text-anchor="middle" font-weight="700" fill="#C4B5FD">🧠 ReplyRepository</text>
      <line x1="20" y1="48" x2="210" y2="48" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <text x="115" y="70" text-anchor="middle" font-size="11.5">Intent &amp; Sentiment</text>
      <text x="115" y="88" text-anchor="middle" font-size="11.5">Tri-Lingual Processor</text>
      <text x="115" y="106" text-anchor="middle" font-size="11.5" fill="#67E8F9">MainViewModel · StateFlow</text>
      <circle cx="115" cy="130" r="4" fill="#00F0FF">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- OUTPUT nodes -->
  <g font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#E0E0F0">
    <g transform="translate(1040,90)">
      <rect width="150" height="50" rx="12" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="75" y="30" text-anchor="middle">🫧 Floating Bubble</text>
    </g>
    <g transform="translate(1040,200)">
      <rect width="150" height="50" rx="12" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="75" y="30" text-anchor="middle">📲 Home Widget</text>
    </g>
    <g transform="translate(1040,310)">
      <rect width="150" height="50" rx="12" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="75" y="30" text-anchor="middle">📋 Clipboard</text>
    </g>
  </g>

  <!-- Connecting lines: input -> capture -->
  <g stroke="url(#lineGrad)" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M 250 98 L 390 98"/>
    <path d="M 250 208 L 390 208"/>
    <path d="M 250 318 L 390 318"/>
  </g>

  <!-- capture -> core -->
  <g stroke="url(#lineGrad)" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M 620 98 C 690 98, 690 190, 750 210"/>
    <path d="M 620 208 L 750 225"/>
    <path d="M 620 318 C 690 318, 690 250, 750 240"/>
  </g>

  <!-- core -> output -->
  <g stroke="url(#lineGrad)" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M 980 190 C 1010 190, 1010 115, 1040 115"/>
    <path d="M 980 225 L 1040 225"/>
    <path d="M 980 260 C 1010 260, 1010 335, 1040 335"/>
  </g>

  <!-- Animated pulses along the main path -->
  <circle r="4" fill="#00F0FF">
    <animateMotion path="M 250 98 L 390 98 C 460 98, 460 190, 750 210 C 900 210, 900 115, 1040 115" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#8B5CF6">
    <animateMotion path="M 250 318 L 390 318 C 460 318, 460 250, 750 240 C 900 240, 900 335, 1040 335" dur="3.6s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle r="4" fill="#00F0FF">
    <animateMotion path="M 250 208 L 390 208 L 620 208 L 750 225 L 980 225 L 1040 225" dur="3s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
</svg>
